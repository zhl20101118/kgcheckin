name: oneshot-export
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export encrypted USERINFO
        env:
          USERINFO: ${{ secrets.USERINFO }}
        run: |
          set -e
          mkdir -p data
          cat > /tmp/pub.pem <<'PEMEOF'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA20jAoRC+L/Wz/OPXhVnJ
NzO13Xk4IQKDbqkmb8FLJBGc/Op5ZOQTE1vhoj82wF9A34PL7cp0TZL5CYEYJ8A9
9tgaPYH/avZvzSwbHUp/5xc71PJo9/PXKLe797uGvOUY7GYTw2mecJMdc2f9Kp0W
RqJ0Eupqu9hJ1TUf8fVd4Go/JGOgEBKc4WTmfmtgnkY8Q0Mqi1cn/Ca0ysUw0/Yh
KP+RfQFsjL1gXv0zsMzZPvThp8KKk2JUM8wWDt8Lj+f74BhqzB6UIaRalzYUQCU4
nsNgVQKzl/X8d4+k0g/M7KZOkj4doi7VeuH6AFmL9IRR1YXAk7a4hubn02LYTCkv
RwIDAQAB
-----END PUBLIC KEY-----

PEMEOF
          K=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s' "$USERINFO" | openssl enc -aes-256-cbc -K "$K" -iv "$IV" | base64 -w0 > data/export.enc
          printf '%s' "$K" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem | base64 -w0 > data/export.key
          printf '%s' "$IV" > data/export.iv
          rm /tmp/pub.pem
          git config user.email "duty@kgcheckin.local"
          git config user.name "kg-duty-bot"
          git add data/
          git commit -m "chore: duty export"
          git push
