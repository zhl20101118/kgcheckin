name: 账号导出
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 把 Secret USERINFO 用 KG_PASS 做 AES-GCM 加密后提交到 data/userinfo.enc
      # 控制台（kgcheckin-console Worker）读取该文件解密导入管理列表。
      - name: 导出加密账号文件
        run: node tools/export_userinfo.mjs
        env:
          USERINFO: ${{ secrets.USERINFO }}
          KG_PASS: ${{ secrets.KG_PASS }}

      - name: 提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/userinfo.enc
          if git diff --cached --quiet; then
            echo "没有变更（USERINFO 为空或未变化）"
          else
            git commit -m "导出加密账号数据"
            if [ -n "$PAT" ]; then
              git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git"
            fi
            git push
          fi
        env:
          PAT: ${{ secrets.PAT }}
