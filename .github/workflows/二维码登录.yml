name: 二维码登录
on:
  workflow_dispatch:
    inputs:
      number:
        description: "需要登录几个账号？"
        required: true
        default: "1"
      append_user:
        description: "是否追加新账号？（不删除已存在账号信息）"
        required: true
        type: choice
        default: "否"
        options:
          - 是
          - 否
# 仅需读取仓库内容；二维码产物经加密后以 artifact 下发，不再需要 contents: write 发布 Release。
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      # gh CLI 用于把登录结果写回仓库 Secret（USERINFO），GitHub 托管 runner 通常已预装。
      - name: 检查 GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version

      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}

      # ════════════════════════════════════════════
      #   步骤一：生成二维码并加密打包（qr_bundle.enc）
      #   二维码是登录凭证，绝不明文放到公开 Release / artifact / Summary，
      #   而是用 Secret QR_PASS 派生密钥进行 AES-256-GCM 加密。
      # ════════════════════════════════════════════
      - name: 生成加密二维码
        id: gen
        run: node qrcodeLogin.js gen
        env:
          NUMBER: ${{ github.event.inputs.number }}
          QR_PASS: ${{ secrets.QR_PASS }}

      # ════════════════════════════════════════════
      #   步骤二：上传「加密后的」二维码包为 artifact（短期保留）
      #   artifact 内容已加密，即使被他人下载也无法查看二维码。
      # ════════════════════════════════════════════
      - name: 上传加密二维码 artifact
        if: ${{ steps.gen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: qr-bundle
          path: qr_bundle.enc
          retention-days: 1
          if-no-files-found: error

      # ═══ 错误处理 ═══
      - name: 二维码生成失败提示
        if: ${{ failure() && steps.gen.outcome == 'failure' }}
        run: |
          echo "::error::❌ 二维码生成失败"
          echo ""
          echo "排查方向："
          echo "  1️⃣ 是否已配置 Secret QR_PASS（用于加密二维码，防止被盗号）"
          echo "  2️⃣ 运行器网络是否能访问酷狗接口（查看上方步骤日志）"
          echo "  3️⃣ npm 依赖安装是否成功"

      # ════════════════════════════════════════════
      #   步骤三：轮询等待用户扫码确认
      #   ════════════════════════════════════════════
      - name: 等待扫码登录
        if: ${{ always() && steps.gen.outcome == 'success' }}
        run: node qrcodeLogin.js wait
        env:
          USERINFO: ${{ secrets.USERINFO }}
          APPEND_USER: ${{ github.event.inputs.append_user }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
